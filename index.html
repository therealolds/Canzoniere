<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canzoniere</title>
  <meta name="description" content="Canzoniere del gruppo scout: testi e accordi." />
  <meta name="theme-color" content="#2e7d32" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./src/style.css" />
  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('theme')) || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* default light */ }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" aria-label="Apri menu" aria-expanded="false">☰</button>
    <a class="brand" href="#/">🏕️ Canzoniere</a>
    <input id="search" class="search" type="search" placeholder="Cerca titolo o testo…" autocomplete="off" />
  </header>

  <div id="drawer-backdrop" class="backdrop"></div>
  <nav id="drawer" class="drawer" aria-label="Menu">
    <div class="drawer-head">Menu</div>
    <a href="#/" data-nav>🏠 Indice</a>
    <a href="#/settings" data-nav>⚙️ Impostazioni</a>
    <a href="#/utilities" data-nav>🧰 Strumenti</a>
    <a href="#/info" data-nav>ℹ️ Info</a>
  </nav>

  <main id="app" class="app"></main>

  <footer class="footer">Gruppo Scout · testi e accordi</footer>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
