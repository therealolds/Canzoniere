<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canzoniere</title>
  <meta name="description" content="Canzoniere del gruppo scout: testi e accordi." />
  <meta name="theme-color" content="#16181b" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./src/style.css" />
  <script>
    // Apply saved theme before first paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('theme')) || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var s = JSON.parse(localStorage.getItem('style')) || 'default';
        document.documentElement.setAttribute('data-style', s);
      } catch (e) { /* default light */ }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" aria-label="Apri menu" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <a class="brand" href="#/">
      <img class="brand-mark" src="./icons/mark.png" alt="" aria-hidden="true" />
      Canzoniere
    </a>
    <div class="search-wrap">
      <input id="search" class="search" type="text" placeholder="Cerca titolo o testo…" autocomplete="off" />
      <button id="search-clear" class="search-clear" aria-label="Cancella ricerca" hidden>&times;</button>
    </div>
  </header>

  <div id="drawer-backdrop" class="backdrop"></div>
  <nav id="drawer" class="drawer" aria-label="Menu">
    <div class="drawer-head">Menu</div>
    <a href="#/" data-nav>Canzoni</a>
    <a href="#/settings" data-nav>Impostazioni</a>
    <a href="#/utilities" data-nav>Strumenti</a>
    <a href="#/info" data-nav>Info</a>
  </nav>

  <main id="app" class="app"></main>

  <footer class="footer">Canzoniere</footer>

  <div class="ridge" aria-hidden="true"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
